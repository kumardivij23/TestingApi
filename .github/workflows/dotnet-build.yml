  name: .NET Build & Test

  on:
    workflow_dispatch:
      inputs:
        ticket_attempt:
          description: "Build attempt number (1-3)"
          required: false
          default: "1"
    push:
      branches:
        - main
        - develop
        - ai/**        # ← was "agent/**", agent creates branches like ai/ap-123-fix-login

  jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.0.x'

        - name: Restore dependencies
          run: dotnet restore

        - name: Build
          run: dotnet build --no-restore --configuration Release

        - name: Run tests
          run: dotnet test --no-build --verbosity normal --configuration Release

        - name: Report attempt
          if: always()
          run: echo "Build attempt ${{ github.event.inputs.ticket_attempt }} completed with status ${{ job.status }}"
